apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: my-virtualservice
  namespace: space-with-istio
spec:
  hosts:
    - "*"
  gateways:
    - my-gateway
  http:
    - match:
        - uri:
            prefix: "/api/log"
      route:
        - destination:
            host: my-app-service.space-with-istio.svc.cluster.local
            port:
              number: 5003
      fault:
        delay:
          fixedDelay: 2s
          percentage:
            value: 100
      timeout: 1s
      retries:
        attempts: 2
        perTryTimeout: 1s
    - match:
        - uri:
            prefix: "/api"
      route:
        - destination:
            host: my-app-service.space-with-istio.svc.cluster.local
            port:
              number: 5003
    - match:
        - uri:
            prefix: "/"
      directResponse:
        status: 404
        body:
          string: "Not Found"
